<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="container">
    <p>Choose Drink:</p>
    <select name="drinks" id="drinks">
        <option value="2.99">Coffee</option>
        <option value="5.99">Dark Coffee</option>
    </select>

    <h3>Choose Amount of drink</h3>
    <input value="2" type="text" id="qty" placeholder="1"/>

    <button id="submit">SUBMIT</button>

    <div id="result"></div>
</div>


<script src="app.js"></script>
</body>
</html>
